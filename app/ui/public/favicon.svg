<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a2b"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- Two parallel contrails curving up to the right, ending in a small aircraft dot. -->
  <path d="M190 800 C 360 720, 520 560, 760 290" fill="none" stroke="url(#trail)" stroke-width="54" stroke-linecap="round"/>
  <path d="M250 840 C 420 760, 580 600, 810 340" fill="none" stroke="url(#trail)" stroke-width="54" stroke-linecap="round" opacity="0.7"/>
  <circle cx="800" cy="300" r="62" fill="#e0f2fe"/>
</svg>
