[package]
name = "contrail"
description = "Contrail desktop app: Tauri command layer over the contrail-* crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# All app code lives in the library so it can be unit-tested; main.rs only calls `run()`.
[lib]
name = "contrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
contrail-aws = { workspace = true }
contrail-core = { workspace = true }
contrail-fake = { workspace = true }
tauri = { version = "2.12.5", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
base64 = "0.23.1"
tauri-plugin-updater = "2.14.0"
# The updater brings a second TLS stack; `run` picks aws-lc-rs (the AWS SDK's) as the default.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` lets tests pause tokio's clock (`#[tokio::test(start_paused = true)]`).
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
