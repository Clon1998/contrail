[package]
name = "contrail"
description = "Contrail desktop app: Tauri command layer over the contrail-* crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# All app code lives in the library so it can be unit-tested; main.rs only calls `run()`.
[lib]
name = "contrail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
contrail-aws = { workspace = true }
contrail-core = { workspace = true }
contrail-fake = { workspace = true }
tauri = { version = "2.12.5", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
