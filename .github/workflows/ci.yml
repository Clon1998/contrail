name: CI

# Lint & test run on every push/PR, except changes to only the website (its own workflow, site.yml)
# or documentation. Installers are built only on pull requests or when started by hand ("Run
# workflow" in the Actions tab, or `gh workflow run ci.yml`), where you tick the platforms to build
# and whether to run lint & test first. Same setup as Frida's CI.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/site.yml", "docs/**", "**.md", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/site.yml", "docs/**", "**.md", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  workflow_dispatch:
    inputs:
      checks:
        description: Run lint & test before building
        type: boolean
        default: true
      windows-x64:
        description: Build Windows
        type: boolean
        default: true
      macos-arm64:
        description: Build macOS (Apple silicon)
        type: boolean
        default: true
      macos-x64:
        description: Build macOS (Intel)
        type: boolean
        default: false
      linux-x64:
        description: Build Linux
        type: boolean
        default: false

# A new push cancels the previous push/PR run on the same ref. Manual runs get their own group
# (the run id), so a push to main never cancels a long manual build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: smaller target folder, faster linking.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    if: github.event_name != 'workflow_dispatch' || inputs.checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # The runner's Ubuntu mirror is sometimes very slow for the WebKit packages: retry, and let
      # the job time out instead of hanging. (Caching the packages with cache-apt-pkgs-action broke
      # the build: the restored -dev packages lacked their pkg-config setup.)
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # `cargo test` regenerates app/ui/src/bindings.ts (tauri-specta) and the recorded demo data
      # for the UI tests; both must match the commit.
      - name: Generated files are up to date
        run: git diff --exit-code -- app/ui/src/bindings.ts app/ui/src/e2e/demo-ecs.json app/ui/src/e2e/demo-logs.json

  frontend:
    name: Frontend (lint, typecheck, test)
    if: github.event_name != 'workflow_dispatch' || inputs.checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: app/ui
        run: pnpm lint
      - name: Typecheck
        working-directory: app/ui
        run: pnpm typecheck
      - name: Test
        working-directory: app/ui
        run: pnpm test

  e2e:
    name: UI flows (Playwright)
    if: github.event_name != 'workflow_dispatch' || inputs.checks
    # The UI against the in-memory fake backend (app/ui/src/e2e); no Rust build needed.
    runs-on: ubuntu-24.04
    # Microsoft's Playwright image has the browsers and their system libraries preinstalled:
    # `playwright install --with-deps` needed apt, and the runner's apt mirror sometimes stalls for
    # 20+ minutes. The tag must match @playwright/test (checked below; GitHub allows no variables in
    # `container.image`). `--ipc=host` is Playwright's advice for Chromium in Docker.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Playwright matches the container image
        working-directory: app/ui
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          test "$version" = "1.64.1" || { echo "::error::@playwright/test is $version; update the container image tag"; exit 1; }
      - name: UI flow tests
        working-directory: app/ui
        run: pnpm e2e
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: app/ui/test-results/
          retention-days: 7

  platforms:
    name: Pick platforms
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          WINDOWS_X64: ${{ inputs.windows-x64 }}
          MACOS_ARM64: ${{ inputs.macos-arm64 }}
          MACOS_X64: ${{ inputs.macos-x64 }}
          LINUX_X64: ${{ inputs.linux-x64 }}
        # Pull requests build everything; manual runs build only the ticked platforms.
        # `artifact` lists the files to upload, one glob per line (`\n` in the JSON).
        run: |
          wanted() { [ "$MANUAL" != true ] || [ "$1" = true ]; }
          entries=()
          # NSIS installs per user (no admin rights needed); unsigned, so SmartScreen warns once.
          wanted "$WINDOWS_X64" && entries+=('{"name":"windows","os":"windows-latest","args":"--bundles nsis","artifact":"target/release/bundle/nsis/*.exe"}')
          wanted "$MACOS_ARM64" && entries+=('{"name":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin --bundles dmg","artifact":"target/aarch64-apple-darwin/release/bundle/dmg/*.dmg"}')
          wanted "$MACOS_X64" && entries+=('{"name":"macos-x64","os":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin --bundles dmg","artifact":"target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"}')
          # Oldest supported Ubuntu, so the AppImage/.deb run on as many distros as possible.
          wanted "$LINUX_X64" && entries+=('{"name":"linux","os":"ubuntu-22.04","args":"--bundles deb,rpm,appimage","artifact":"target/release/bundle/deb/*.deb\ntarget/release/bundle/rpm/*.rpm\ntarget/release/bundle/appimage/*.AppImage"}')
          [ ${#entries[@]} -gt 0 ] || echo "::warning::No platform selected, nothing to build"
          include="[$(IFS=,; echo "${entries[*]}")]"
          echo "Building: $include"
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: Installer (${{ matrix.name }})
    needs: [rust, frontend, e2e, platforms]
    # Run when lint & test passed, or were skipped on purpose in a manual run.
    if: >-
      !cancelled() && github.event_name != 'push'
      && needs.platforms.result == 'success' && needs.platforms.outputs.include != '[]'
      && (needs.rust.result == 'success' || needs.rust.result == 'skipped')
      && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Add the macOS target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      # Builds the frontend first (beforeBuildCommand in tauri.conf.json).
      - name: Build installer
        working-directory: app
        run: pnpm build ${{ matrix.args }}
      # Download from the run's page (Artifacts), or: gh run download <run id> -n contrail-<name>
      - uses: actions/upload-artifact@v7
        with:
          name: contrail-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
