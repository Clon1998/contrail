name: Release

# Pushing a tag like v0.1.0 builds unsigned installers for macOS (Apple silicon and Intel),
# Windows and Linux and publishes them as a GitHub Release with notes from the changelog.
#
# In-app updates need the secrets TAURI_SIGNING_PRIVATE_KEY (the content of the key from
# `pnpm tauri signer generate`) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; the matching public key is
# `plugins.updater.pubkey` in tauri.conf.json (docs/updates-and-public-release.md). With them, each
# installer gets a `.sig` and tauri-action adds a `latest.json`, which installed apps read once the
# release is published. Without them, releases still build, just without updater files.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release notes from the commits since the previous tag
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: notes.md
      - name: Create a draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a suffix (v0.2.0-rc.1) become pre-releases.
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $prerelease \
            --title "Contrail ${GITHUB_REF_NAME#v}" --notes-file notes.md
          echo "id=$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          # NSIS installs per user (no admin rights needed).
          - name: windows
            os: windows-latest
            args: --bundles nsis
          # The oldest supported Ubuntu, for the widest glibc compatibility (.deb, .rpm, AppImage).
          - name: linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Add the macOS target
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Enable updater artifacts
        if: env.HAS_UPDATER_KEY == 'true'
        shell: bash
        run: echo "UPDATER_CONFIG=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the updater artifacts (Tauri's own signature; installers stay unsigned).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ env.UPDATER_CONFIG }}
          releaseId: ${{ needs.draft.outputs.release_id }}
          # latest.json for in-app updates (each build adds its platform).
          uploadUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}

  publish:
    name: Publish the release
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --latest=false || echo --latest)
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false $latest
