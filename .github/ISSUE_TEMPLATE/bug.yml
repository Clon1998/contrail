name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select profile …
        2. Open the logs of a service …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Contrail version
      description: Settings → About shows it.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS (Apple silicon), macOS (Intel), Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines, error messages or screenshots
      description: >-
        If a log format isn't parsed right, a made-up line with the same structure helps most. Please don't paste
        real log content you'd rather not share, account IDs, ARNs, credentials or secret values.
