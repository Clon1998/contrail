name: Feature request
description: Something Contrail should do, or do differently.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: >-
        How it could work. Contrail stays read-only towards AWS, so actions like restarting or scaling a service are
        out of scope.
