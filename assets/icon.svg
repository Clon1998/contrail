<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Contrail app icon: an aircraft climbing out of the night sky, trailing log lines
       instead of vapour. Below 64px use icon-small.svg, which keeps only the essentials. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#050818"/>
    </linearGradient>
    <!-- Local coordinates: the aircraft points along +x, trails run along -x. -->
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="-720" y1="0" x2="-40" y2="0">
      <stop offset="0" stop-color="#22e5ff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#3b7bff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8ea6ff" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#5b6cff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" gradientUnits="userSpaceOnUse" x1="0" y1="-180" x2="0" y2="180">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="896" rx="200"/>
    </clipPath>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>

  <!-- A few faint stars in the empty sky. -->
  <g fill="#e0e7ff">
    <circle cx="210" cy="230" r="5" opacity="0.5"/>
    <circle cx="330" cy="170" r="3" opacity="0.35"/>
    <circle cx="160" cy="380" r="3" opacity="0.3"/>
    <circle cx="820" cy="640" r="4" opacity="0.35"/>
    <circle cx="720" cy="820" r="3" opacity="0.25"/>
    <circle cx="880" cy="500" r="3" opacity="0.3"/>
  </g>

  <g clip-path="url(#tile)">
    <g transform="translate(640 390) rotate(-35) scale(1.15)">
      <circle cx="20" cy="0" r="240" fill="url(#glow)"/>

      <!-- Fainter log lines streaming alongside the engine trails. -->
      <g stroke="url(#trail)" stroke-linecap="round" fill="none">
        <path stroke-width="12" stroke-opacity="0.35" d="M -260 -215 H -300 M -335 -215 H -470"/>
        <path stroke-width="18" stroke-opacity="0.55" d="M -130 -150 H -250 M -360 -150 H -640"/>
        <path stroke-width="18" stroke-opacity="0.6" d="M -250 -30 H -400 M -440 -30 H -480 M -520 -30 H -600"/>
        <path stroke-width="14" stroke-opacity="0.45" d="M -370 25 H -720"/>
        <path stroke-width="18" stroke-opacity="0.55" d="M -150 140 H -200 M -240 140 H -380 M -420 140 H -460"/>
        <path stroke-width="12" stroke-opacity="0.35" d="M -190 200 H -230 M -270 200 H -560"/>
        <path stroke-width="10" stroke-opacity="0.25" d="M -330 250 H -420"/>
      </g>

      <!-- Two entries stand out by level, the way a warning or error would in the log view. -->
      <circle cx="-322" cy="25" r="13" fill="#fbbf24"/>
      <circle cx="-305" cy="-150" r="13" fill="#fb7185"/>

      <!-- One contrail per engine, split into segments like the fields of a log line
           (timestamp, level, message). -->
      <g stroke="url(#trail)" stroke-width="30" stroke-linecap="round" fill="none">
        <path d="M -70 -85 H -110 M -150 -85 H -290 M -330 -85 H -360 M -400 -85 H -660"/>
        <path d="M -70 85 H -180 M -220 85 H -250 M -290 85 H -540"/>
      </g>

      <!-- Generic twin-engine jet seen from above: fuselage, swept wings, tailplane. -->
      <g fill="url(#plane)">
        <path d="M 200 0
                 C 200 -16, 186 -24, 160 -24
                 L 60 -24 L -40 -180 L -76 -180 L -24 -24
                 L -112 -24 L -150 -80 L -174 -80 L -160 -14
                 L -180 0
                 L -160 14 L -174 80 L -150 80 L -112 24
                 L -24 24 L -76 180 L -40 180 L 60 24
                 L 160 24
                 C 186 24, 200 16, 200 0 Z"/>
        <rect x="-8" y="-100" width="62" height="30" rx="15"/>
        <rect x="-8" y="70" width="62" height="30" rx="15"/>
      </g>
    </g>
  </g>

  <rect x="66" y="66" width="892" height="892" rx="198" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
