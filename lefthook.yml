# Git hooks (installed automatically by `pnpm install`). Skip once with `git commit --no-verify`.

# Fast checks on every commit, only on what's staged.
pre-commit:
  parallel: true
  jobs:
    - name: rustfmt
      glob: '*.rs'
      run: cargo fmt --all -- --check
    - name: eslint
      glob: '*.{ts,mts,mjs,js,vue}'
      run: pnpm exec eslint {staged_files}
    - name: prettier
      glob: '*.{ts,mts,mjs,js,vue,json,yml,yaml,css}'
      run: pnpm exec prettier --check {staged_files}

# Conventional Commits (see commitlint.config.mjs).
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# The full suite before anything leaves the machine.
pre-push:
  parallel: true
  jobs:
    - name: rust
      run: cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace
    - name: frontend
      run: pnpm typecheck && pnpm test
