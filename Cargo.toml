# Cargo workspace for Contrail.
#
# Think of this like a Maven parent POM: it lists the member crates (modules) and centrally
# defines dependency versions (`[workspace.dependencies]`, like `<dependencyManagement>`).
# Member crates then write `foo = { workspace = true }` instead of repeating the version.
[workspace]
resolver = "3"
members = [
    "crates/contrail-core",
    "crates/contrail-aws",
    "crates/contrail-fake",
    "app/src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
contrail-core = { path = "crates/contrail-core" }
contrail-aws = { path = "crates/contrail-aws" }
contrail-fake = { path = "crates/contrail-fake" }

# Shared third-party crates
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps JSON object keys in their original order (log fields are shown that way).
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = "1.13.1"
thiserror = "2.0.21"
async-trait = "0.1.92"
futures = "0.3.34"
time = { version = "0.3.55", features = ["serde", "parsing", "formatting", "macros"] }
sha1 = "0.11.0"
url = "2.5.8"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Rust <-> TypeScript type generation. The Tauri 2 line of tauri-specta is still a release
# candidate and requires an *exact* specta version, so both are pinned with `=` (same as Frida).
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# AWS SDK (only used inside contrail-aws).
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-cloudwatchlogs = "1.160.0"
aws-sdk-ecs = "1.154.0"
aws-sdk-secretsmanager = "1.123.0"
aws-sdk-ssm = "1.131.0"
aws-sdk-ssooidc = "1.119.0"
aws-sdk-sts = "1.122.0"
aws-smithy-mocks = "0.3.0"
aws-smithy-types = "1.4"

# Testing
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
tempfile = "3.27.0"

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies (the AWS SDK alone is large) are built without debug info in dev/test builds:
# smaller target folder and faster linking. Our own crates keep full debug info.
[profile.dev.package."*"]
debug = false
